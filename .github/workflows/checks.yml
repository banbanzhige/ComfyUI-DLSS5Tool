name: Source and reference checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project:
    name: Source, workflows and upload contents
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check project rules, source boundaries and documentation
        run: python -B scripts/check_project.py
      - name: Verify original reference snapshot and workflow structure
        run: python -B scripts/verify_handoff.py
      - name: Verify release pins and version increments
        env:
          VERSION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python -B scripts/check_versions.py
      - name: Audit tracked upload contents
        run: python -B scripts/check_upload.py
      - name: Check runtime setup contracts without downloads or GPU
        run: python -B -m unittest discover -s tests -p test_runtime_setup.py
      - name: Check release version and dependency upgrade contracts
        run: python -B -m unittest discover -s tests -p test_versioning.py
  reference:
    name: Selected CPU reference modules
    needs: project
    runs-on: windows-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-reference.txt
      - name: Install CPU reference check dependencies
        run: python -m pip install -r requirements-reference.txt
      - name: Run selected CPU reference tests
        run: python -B scripts/run_reference_checks.py
