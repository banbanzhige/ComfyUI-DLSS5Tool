name: 问题反馈
description: 记录三个图片节点的复现条件和实际结果。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: 请先查看 README 的已验证范围。反馈将公开；日志和截图请去掉邮箱、用户名、私人路径及令牌，不上传专有 DLL 或私人素材。安全漏洞请按 SECURITY.md 私下报告。
  - type: textarea
    id: problem
    attributes:
      label: 问题与预期
      description: 哪个操作触发问题，实际结果和预期结果分别是什么。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 测试环境
      description: 填写插件版本或代码提交、Windows、GPU / 驱动、ComfyUI、Python、Torch 和 DLL 版本；可附 scripts/show_version.py --json 的输出。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与输入
      description: 包括工作流、图片尺寸 / 批次、Alpha / 保护遮罩、SDR 或可信 HDR 来源及参数。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 验证结果与补充
      description: 可填写错误摘要、缓存 / 取消行为、临时文件和进程回收情况；分享素材须有相应授权，不附凭证、专有 DLL 或私人日志。
